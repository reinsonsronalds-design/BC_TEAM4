---
# Host-only AWS deployment through the existing EC2 instance profile.
- name: Health-gated Slice and Sip roleless blue/green deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    image_tag: ""
    deploy_enabled: false
  tasks:
    - name: Require immutable image tag
      ansible.builtin.assert:
        that:
          - image_tag is match('^[0-9a-f]{40}-[1-9][0-9]*$')
    - name: Preview or deploy the inactive ECS service
      ansible.builtin.command:
        argv: "{{ ['python3', playbook_dir + '/../ci/roleless_blue_green.py', '--tag', image_tag] + (['--deploy'] if (deploy_enabled | bool) else []) }}"
      environment:
        PATH: /opt/slice-sip/bin:/usr/local/bin:/usr/bin:/bin
        SLICE_SIP_TF_DIR: "{{ playbook_dir }}/../infrastructure"
      register: deployment
      changed_when: (deploy_enabled | bool) and ('SUCCESS:' in deployment.stdout)
    - name: Show outcome
      ansible.builtin.debug:
        var: deployment.stdout_lines
