# Local development ONLY: stateless API + NGINX (no database or SQS).
services:
  backend:
    build:
      context: ./backend
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_HOST: backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
