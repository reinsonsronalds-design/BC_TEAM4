when:
  - event: [push, manual, deployment]
    branch: feature/ecs-fargate

steps:
  - name: check-project-files
    image: alpine:3.21
    commands:
      - test -f Dockerfile
      - test -f index.html

  - name: build-container-image
    image: woodpeckerci/plugin-kaniko:2.3.4
    settings:
      registry: https://index.docker.io/v1/
      repo: aivisp/slice.sip.app.v1.0
      destinations:
        - index.docker.io/aivisp/slice.sip.app.v1.0:${CI_COMMIT_SHA}
        - index.docker.io/aivisp/slice.sip.app.v1.0:latest
      username:
        from_secret: dockerhub_user
      password:
        from_secret: dockerhub_token
    when:
      - event: [push, manual]

  - name: deploy-fargate
    image: public.ecr.aws/aws-cli/aws-cli:2.27.41
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION: eu-west-1
    commands:
      - aws ecs update-service --cluster slice-sip-cluster --service slice-sip-service --force-new-deployment
      - aws ecs wait services-stable --cluster slice-sip-cluster --services slice-sip-service
      - aws ecs describe-services --cluster slice-sip-cluster --services slice-sip-service --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}" --output table
    when:
      - event: deployment