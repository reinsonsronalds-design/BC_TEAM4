# ACTIVATE ONLY after ECR secret rotation works:
#   cp ci/verify-publish.yml.example .woodpecker/verify.yml
# Use the approved demo branch; no GitHub webhook required.
# No AWS access keys, Docker socket, or privileged Kaniko needed in pipeline.
when:
  - event: [push, manual]
    branch: devops/demo-pipeline

steps:
  - name: unit-tests
    image: python:3.12-slim
    commands:
      - python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest httpx
      - PYTHONPATH=backend python -m pytest -q backend/tests

  - name: publish-frontend
    image: woodpeckerci/plugin-kaniko@sha256:54d5a5869ddb652372979b7714b706826fda33d48ea94c9d54d673be16ab5645
    settings:
      registry: 597765856364.dkr.ecr.eu-west-1.amazonaws.com
      repo: slice-sip-frontend
      tags: ${CI_COMMIT_SHA}-${CI_PIPELINE_NUMBER}
      context: .
      dockerfile: Dockerfile
      username: AWS
      password:
        from_secret: ecr_password

  - name: publish-backend
    image: woodpeckerci/plugin-kaniko@sha256:54d5a5869ddb652372979b7714b706826fda33d48ea94c9d54d673be16ab5645
    settings:
      registry: 597765856364.dkr.ecr.eu-west-1.amazonaws.com
      repo: slice-sip-backend
      tags: ${CI_COMMIT_SHA}-${CI_PIPELINE_NUMBER}
      context: backend
      dockerfile: backend/Dockerfile
      username: AWS
      password:
        from_secret: ecr_password
